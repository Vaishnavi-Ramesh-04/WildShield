<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WildShield - Forest Authority Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  #map { flex: 1; }
  #side { width: 340px; overflow-y: auto; padding: 12px; background: #f6f7f4; border-left: 1px solid #ccc; }
  h2 { margin: 0 0 8px; font-size: 18px; color: #1b5e20; }
  h3 { margin: 14px 0 6px; font-size: 14px; }
  .alert { padding: 8px; margin-bottom: 6px; border-radius: 6px; font-size: 13px; border-left: 5px solid #999; background: #fff; }
  .critical { border-color: #c62828; background: #ffebee; }
  .high { border-color: #ef6c00; background: #fff3e0; }
  .caution { border-color: #f9a825; background: #fffde7; }
  small { color: #666; }
  #login { position: fixed; inset: 0; background: #1b5e20; display: flex; align-items: center; justify-content: center; z-index: 2000; }
  #login form { background: #fff; padding: 28px; border-radius: 10px; width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  #login h1 { margin: 0 0 4px; font-size: 22px; color: #1b5e20; }
  #login input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 12px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  button { padding: 10px; border: 0; border-radius: 6px; background: #2e7d32; color: #fff; font-size: 14px; cursor: pointer; }
  #login button { width: 100%; }
  #err { color: #c62828; font-size: 13px; min-height: 18px; }
  #who { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; }
  #who button { padding: 4px 10px; background: #757575; }
</style>
</head>
<body>
<div id="login">
  <form id="loginForm">
    <h1>WildShield</h1>
    <small>Forest Authority Login (officials and admin only)</small><br><br>
    <label>Official ID</label>
    <input id="lid" placeholder="e.g. FO-1001" autocomplete="username" required>
    <label>Password</label>
    <input id="lpw" type="password" autocomplete="current-password" required>
    <div id="err"></div>
    <button type="submit">Sign in</button>
  </form>
</div>
<div id="map"></div>
<div id="side">
  <div id="who"><span id="whoName"></span><button id="logout">Logout</button></div>
  <h2>WildShield Control Room</h2>
  <small>Live animals, passed-in visitors and alerts (refreshes every 2 s)</small>
  <h3>Animals</h3><div id="animals">-</div>
  <h3>Visitors inside (active e-pass)</h3><div id="users">-</div>
  <h3>Alerts</h3><div id="alerts">No alerts</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let token = sessionStorage.getItem("ws_token");
const showLogin = (msg) => { document.getElementById("login").style.display = "flex"; document.getElementById("err").textContent = msg || ""; };
const hideLogin = () => { document.getElementById("login").style.display = "none"; };
if (token) hideLogin();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ login: document.getElementById("lid").value, password: document.getElementById("lpw").value }) });
  const d = await r.json();
  if (!r.ok) return showLogin(d.error);
  if (d.user.role === "user") return showLogin("Access denied: this dashboard is for forest officials only.");
  token = d.token; sessionStorage.setItem("ws_token", token);
  document.getElementById("whoName").textContent = `${d.user.name} (${d.user.role})`;
  document.getElementById("lpw").value = "";
  hideLogin(); refresh();
});
document.getElementById("logout").addEventListener("click", () => {
  sessionStorage.removeItem("ws_token"); token = null; showLogin("Logged out"); 
});
if (token) fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } }).then(r => r.json())
  .then(u => { if (u.name) document.getElementById("whoName").textContent = `${u.name} (${u.role})`; });

const map = L.map("map").setView([10.285, 76.569], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const colors = { boundary: "#2e7d32", village: "#c62828", trail: "#ef6c00" };

async function refresh() {
  try {
    if (!token) return;
    const r = await fetch("/api/live", { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401 || r.status === 403) { sessionStorage.removeItem("ws_token"); token = null; return showLogin("Session expired. Please sign in again."); }
    const d = await r.json();
    layer.clearLayers();
    d.zones.forEach(z => L.polygon(z.polygon, { color: colors[z.type] || "#555", weight: 2, fillOpacity: 0.08 })
      .bindTooltip(z.name).addTo(layer));
    let aHtml = "";
    d.animals.forEach(a => {
      if (!a.last) { aHtml += `<div>${a.id} - no data</div>`; return; }
      if (a.trail.length > 1) L.polyline(a.trail.map(p => [p.lat, p.lon]), { color: "#6d4c41" }).addTo(layer);
      L.circleMarker([a.last.lat, a.last.lon], { radius: 9, color: "#4e342e", fillColor: "#8d6e63", fillOpacity: 1 })
        .bindTooltip(`${a.id} ${a.species}`, { permanent: true }).addTo(layer);
      L.circle([a.last.lat, a.last.lon], { radius: 100, color: "#c62828", fill: false, dashArray: "4" }).addTo(layer);
      if (a.predicted_30min) L.circleMarker([a.predicted_30min.lat, a.predicted_30min.lon],
        { radius: 6, color: "#6a1b9a", fillOpacity: 0.3 }).bindTooltip("Predicted +30 min").addTo(layer);
      aHtml += `<div><b>${a.id}</b> ${a.species}<br><small>speed ${a.predicted_30min ? a.predicted_30min.speed_kmh.toFixed(1) : 0} km/h</small></div>`;
    });
    document.getElementById("animals").innerHTML = aHtml || "-";
    document.getElementById("users").innerHTML = d.users.map(u => {
      L.circleMarker([u.lat, u.lon], { radius: 7, color: "#1565c0", fillColor: "#42a5f5", fillOpacity: 1 })
        .bindTooltip(u.name).addTo(layer);
      return `<div>${u.name} <small>pass ${u.pass_id}</small></div>`;
    }).join("") || "None";
    document.getElementById("alerts").innerHTML = d.alerts.map(a =>
      `<div class="alert ${a.severity}"><b>${a.severity.toUpperCase()}</b> ${a.message}<br><small>${new Date(a.time).toLocaleTimeString()}</small></div>`
    ).join("") || "No alerts";
  } catch (e) { console.error(e); }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
